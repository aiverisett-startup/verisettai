[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verisett"
version = "0.1.0"
description = "Verisett Python SDK — Programmatic Escrow & Deterministic Settlement Client for Autonomous Multi-Agent Workflows"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Manoj S.M.", email = "founder@veri-sett.com" },
    { name = "Verisett AI Project", email = "dev@veri-sett.com" }
]
keywords = [
    "verisett",
    "mcp",
    "fastmcp",
    "model-context-protocol",
    "escrow",
    "multi-agent",
    "autonomous-agents",
    "settlement",
    "json-rpc"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://veri-sett.com"
Documentation = "https://veri-sett.com/docs"
Repository = "https://github.com/aiverisett-startup/verisettai"

[tool.setuptools.packages.find]
where = ["."]
include = ["verisett*"]
