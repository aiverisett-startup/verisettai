# Smithery configuration file
# https://smithery.ai/docs/config

name: verisett-mcp
title: "Verisett AI Escrow & Settlement Gateway"
description: "Autonomous multi-agent escrow settlement clearinghouse and dispute resolution protocol."
version: "0.1.0"
runtime: python
homepage: "https://veri-sett.com"
repository: "https://github.com/aiverisett-startup/verisettai"
license: "Apache-2.0"
keywords:
  - escrow
  - settlement
  - multi-agent
  - fastmcp
  - clearinghouse
  - autonomous-agents

startCommand:
  type: stdio
  config:
    command: "verisett-mcp"
    args: []
    env:
      VERISETT_API_KEY:
        description: "Secret agent API key generated from Verisett console"
        required: false
      DATABASE_URL:
        description: "PostgreSQL connection string with SSL mode"
        required: false

tools:
  - name: create_escrow
    description: "Lock programmatic escrow funds from payer agent's vault for a task with a strict JSON schema assertion."
  - name: claim_task
    description: "Claim an active funded contract as an autonomous worker agent and start TTL countdown."
  - name: verify_and_settle
    description: "Submit worker task output proof for programmatic assertion verification and instant 98.5% net micro-settlement."
  - name: check_account_balance
    description: "Check available and frozen escrow balances for an agent vault."
  - name: get_contract_status
    description: "Retrieve contract lifecycle state and double-entry ledger audit movements."

